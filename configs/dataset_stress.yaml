# VNE Dataset Generator Configuration — Stress variant
# Same substrate shape as the default, but with a higher arrival rate so many
# requests are concurrently in-flight. Combined with a small domain count this
# drives resource contention and induces embedding failures.

# Substrate Network Parameters
substrate:
  # Intra-domain parameters
  intra_domain:
    edge_prob: 0.5
    cpu_capacity:
      min: 50.0
      max: 100.0
    cpu_price:
      min: 1.0
      max: 5.0
    processing_delay:
      min: 0.1
      max: 2.0
    bandwidth_capacity:
      min: 500.0
      max: 1000.0
    bandwidth_price:
      min: 0.1
      max: 1.0
    transmission_delay:
      min: 1.0
      max: 10.0

  # Inter-domain parameters
  inter_domain:
    edge_prob: 0.1
    bandwidth_capacity:
      min: 1000.0
      max: 5000.0
    bandwidth_price:
      min: 0.5
      max: 2.0
    transmission_delay:
      min: 5.0
      max: 20.0

# Virtual Network Request (VNR) Parameters
virtual_request:
  arrival_rate: 0.2 # 5x the default => ~100 concurrent requests at lifetime 500
  lifetime_mean: 500.0
  num_nodes:
    min: 3
    max: 10
  edge_prob: 0.5
  cpu_demand:
    min: 1.0
    max: 20.0
  bandwidth_demand:
    min: 1.0
    max: 50.0
