# V2 — direct autoregressive decoding (no PSO during pretrain). PSO config
# below is only used by the `rl_oa_mp_vne_v2_pso` inference variant.

# Inference mode for solve(). Pretrain ALWAYS uses direct regardless.
#   direct: autoregressive sampling with collision masking (no PSO)
#   pso:    legacy top-K + PSO (kept for A/B comparison)
inference_mode: direct

pso:
  num_particles: 20
  num_iterations: 15
  w: 0.7
  c1: 1.5
  c2: 1.5
  mutation_rate: 0.1
  policy_bias_alpha: 50.0

policy_network:
  hidden_size: 64
  gcn_hidden: 32
  learning_rate: 0.001
  gamma: 0.99

candidates:
  K: 5   # only used by PSO inference variant; direct mode picks 1/vnode

training:
  pretrain_episodes: 5000
  batch_size: 64
  online_k: 10
  # --- V2 objective: cost minimization + single-path ---
  reward_cost_scale: 1000.0       # success reward = -cost / scale  (range ~ [-5, 0])
  reward_fail: -10.0              # fail penalty — clearly worse than worst success
  # --- Redesigned optimization (V2) ---
  critic_coef: 0.5                # weight on MSE(V(s), R)
  entropy_start_coef: 0.05        # high β early → force exploration (escape plateau)
  entropy_end_coef: 0.005         # low β late → exploit
  entropy_anneal_batches: 50      # linear decay over first ~70% of training
  critic_warmup_batches: 10       # smooth ramp 0→1 (vs hard step before)
  weight_decay: 1.0e-4            # AdamW regularization
  lr_cosine_total_batches: 78     # ~total batches (5000/64)
  lr_min_ratio: 0.1               # cosine anneal to 10% of init lr
  normalize_advantage: true       # (A − A.mean())/A.std() within batch
  # --- VN distribution ---
  vn_min_nodes: 2
  vn_max_nodes: 8
  vn_min_cpu: 1.0
  vn_max_cpu: 30.0
  vn_min_bw: 5.0
  vn_max_bw: 80.0
  vn_link_prob: 0.5
