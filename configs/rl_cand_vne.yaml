policy_network:
  hidden_size: 64
  num_gcn_layers: 2

training:
  pretrain_episodes: 5000
  inline_pretrain_episodes: 500
  batch_size: 16
  online_k: 10
  baseline_window: 100
  lam_sup: 1.0
  warmup_fraction: 0.2
  u_max_cpu: 0.8
  u_max_bw: 0.8
  warmup_M_max: 20
  R_penalty: 10.0
  learning_rate: 0.001
  checkpoint_every: 500
  online_save_every: 100
  vn_min_nodes: 2
  vn_max_nodes: 8
  vn_min_cpu: 1.0
  vn_max_cpu: 30.0
  vn_min_bw: 5.0
  vn_max_bw: 80.0
  vn_link_prob: 0.5
  allowed_domains:
    p_all: 0.5
    p_single: 0.3
    p_subset: 0.2
    subset_min: 2
    subset_max: 3

candidates:
  K: 5

pso:
  num_particles: 20
  num_iterations: 15
  w: 0.7
  c1: 1.5
  c2: 1.5
  mutation_rate: 0.1

checkpoint:
  path: checkpoints/rl_cand_vne.pt
  require_hash_match: false
